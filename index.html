<main><h1>Bearer Quant Backup</h1>
<p>Bearer Quant Backup は、運用者本人のデータと研究レポートをGoogle Driveへバックアップし、復元するための個人用ツールです。転送にはrcloneを使用します。</p>
<p>利用者がGoogleの認証画面で許可したDriveに接続し、指定フォルダへ圧縮アーカイブと復元用の目録を保存します。復元時にはアーカイブを読み取り、ハッシュで整合性を確認します。</p>
<p>一般向けのオンラインサービスではありません。このサイトでは、データ、研究結果、認証情報を公開しません。</p>
